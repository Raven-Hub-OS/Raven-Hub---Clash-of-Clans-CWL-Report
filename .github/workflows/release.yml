name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Wine para build Windows
        uses: egor-tensin/setup-wine@v1
        with:
          wine-version: 8.0

      - name: Build da aplicação
        run: npm run build

      - name: Build e publicar para Windows
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINEPREFIX: /home/runner/.wine
          HOME: /home/runner
